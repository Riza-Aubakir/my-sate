<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сайт-визитка</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #222;
    }
    header {
      padding: 20px;
      background: #222;
      color: white;
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 900px;
      margin: auto;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }
    section {
      max-width: 900px;
      margin: auto;
      padding: 60px 20px;
    }
    .hero {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 30px;
    }
    .card {
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      flex: 1;
    }
    button {
      padding: 10px 20px;
      cursor: pointer;
    }
    footer {
      padding: 20px;
      text-align: center;
      background: #222;
      color: white;
    }
    @media (max-width: 600px) {
      nav,
      .hero {
        flex-direction: column;
      }
      nav a {
        margin: 10px;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <strong>Мой сайт</strong>
      <div>
        <a href="#about">Обо мне</a>
        <a href="#contact">Контакты</a>
      </div>
    </nav>
  </header>
  <section class="hero">
    <div>
      <h1>Привет! Я начинающий веб-разработчик</h1>
      <p id="message">Создаю простые и удобные сайты.</p>
      <button id="myButton">Узнать больше</button>
    </div>
  </section>
  <section id="about">
    <h2>Обо мне</h2>
    <div class="hero">
      <div class="card">
        <h3>HTML</h3>
        <p>Создаю структурированные веб-страницы.</p>
      </div>
      <div class="card">
        <h3>CSS</h3>
        <p>Оформляю страницы и делаю их адаптивными.</p>
      </div>
      <div class="card">
        <h3>JavaScript</h3>
        <p>Добавляю интерактивность.</p>
      </div>
    </div>
  </section>
  <section id="contact">
    <h2>Контакты</h2>
    <p>Email: example@mail.com</p>
  </section>
  <footer>
    © 2026 Мой сайт
  </footer>
  <script>
    document.getElementById("myButton").onclick = function() {
      document.getElementById("message").textContent =
        "Спасибо за интерес к моему сайту!";
    };
  </script>
</body>
</html>
